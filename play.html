 else{panel='<div class="eyebrow">Your move</div><h2>'+(state.mine===null?'Cast your vote':'Vote received')+'</h2>'+(state.mine===null?'<div class="choices">'+button('auto','Automate it')+button('keep','Keep it manual','alt')+'</div>':'<p>Watch for the room’s results.</p>')}}
 else{board+='<h2>Room vote</h2>'+bars(state.a,state.total);panel='<div class="eyebrow">Workshop debrief</div><h2>'+q[2]+'</h2><p>'+q[3]+'</p>'+(preview||presenter?button('advance',s===10?'Final scoreboard':'Next round'):'')}}
 screen.innerHTML='<section class="board">'+board+'</section><aside class="panel">'+panel+'</aside>';
}
async function api(body){const r=await fetch(body?'/api':'/api?'+new URLSearchParams({room,voter}),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Connection lost');return d}
async function refresh(){if(reading)return;reading=true;try{let d=await api(),key=JSON.stringify(d);if(key!==signature){signature=key;state=d;render()}err.textContent=''}catch(e){err.textContent=e.message}finally{reading=false}}
screen.onclick=async e=>{const id=e.target.closest('button')?.id;if(!id||busy)return;busy=true;try{
 if(preview){if(id==='create'){samples=[];state={stage:0,total:0,mine:null,rounds:[]}}else if(id==='advance'){state.stage++;state.mine=null;if(state.stage%2)state.total=0;state.rounds=samples}else{let i=(state.stage-1)/2;state.mine=id==='auto'?0:1;state.a=[6,2,1,7,7][i]+(state.mine===0?1:0);state.total=10;samples[i]={total:10,a:state.a}}render();return}
 if(id==='copy'){if(navigator.clipboard)await navigator.clipboard.writeText(joinUrl);else prompt('Copy joining link',joinUrl);return}
 if(id==='create'){const d=await api({op:'create'});localStorage.setItem('host-'+d.id,d.host);location.href='/?present='+d.id;return}
 if(id==='advance')await api({op:'advance',room,host:presenter,stage:state.stage});else await api({op:'vote',room,stage:state.stage,voter,choice:id==='auto'?0:1});await refresh()
}catch(e){err.textContent=e.message}finally{busy=false}};
if(preview||!room)render();else{refresh();setInterval(refresh,1500)}

</script></html>
